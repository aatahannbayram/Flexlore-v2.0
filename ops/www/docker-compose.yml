# Production site flexlore.com: static export (out/) served by nginx, behind the shared Caddy proxy (network "web").
# Lives in /opt/sites/flexlore-web on the VPS. Only this container is created or restarted by a deploy.
services:
  flexlore-web:
    image: nginx:alpine
    container_name: flexlore-web
    restart: unless-stopped
    volumes: ["./html:/usr/share/nginx/html:ro", "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [web]
networks:
  web:
    external: true
