# www.flexlore.com, static export. TLS, compression and security headers are set by Caddy (ops/www/flexlore.caddy).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Relative redirects: nginx sits behind Caddy, so never build http://host:80 URLs ("/blog" -> "/blog/").
  absolute_redirect off;

  # Old Framer URLs (docs/launch/redirects.json): job pages to /careers/, /download to the home page (store badges are there).
  location = /download { return 301 /; }
  location = /download/ { return 301 /; }
  location ~ ^/careers/(product-designer-ui-ux|senior-software-engineer)/?$ { return 301 /careers/; }

  # Hashed build assets never change; media changes rarely.
  location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location ~* \.(?:avif|webp|jpe?g|png|svg|gif|ico|mp4|webm|woff2?)$ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

  # Printed QR codes (flexlore-platform "qr" app) point at /q/<code>. The page and Apple's app-link file live in ./qr
  # (ops/www/qr), mounted beside the site build, so a site deploy (html swap) never drops them.
  location ^~ /q/ { root /usr/share/nginx/qr; try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location = /.well-known/apple-app-site-association {
    root /usr/share/nginx/qr; default_type application/json; try_files /apple-app-site-association =404;
  }

  location / { try_files $uri $uri.html $uri/ =404; }
  error_page 404 /404.html;
}
