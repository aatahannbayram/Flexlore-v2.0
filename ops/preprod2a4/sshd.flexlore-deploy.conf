# /etc/ssh/sshd_config.d/60-flexlore-deploy.conf
# authorized_keys'teki restrict,command="..." satırlarına ek güvence: kısıtsız bir satır eklense bile
# flexlore-deploy shell, PTY veya yönlendirme alamaz; her bağlantı yalnızca yayın scriptini çalıştırır.
# Bu dosyadaki Match bloğu dosyanın sonunda biter; root ve diğer kullanıcıların ayarları değişmez.
Match User flexlore-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand sudo /usr/local/bin/flexlore-publish
    PermitTTY no
    DisableForwarding yes
    PermitTunnel no
    PermitUserRC no
    ExposeAuthInfo yes
